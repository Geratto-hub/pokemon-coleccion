name: Actualizar cartas y precios

on:
  schedule:
    - cron: "17 5 * * *"   # cada día a las 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - colecciones.json
      - datos-comun.js
      - scripts/actualizar-datos.mjs
      - .github/workflows/datos.yml

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar datos de TCGdex
        run: node scripts/actualizar-datos.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar precios $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
